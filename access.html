<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · LIMAGECILS PRO</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="espace.css?v=20261115-4"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#f5e5ed,transparent 70%),#fcf9fa}.login-card{width:min(100%,420px);padding:38px;background:#fffafc;border:1px solid #ead5de;border-radius:8px;box-shadow:0 20px 65px #61374c0c}.login-card .brand{display:block;text-align:center;margin-bottom:36px}.login-card h1{font-size:42px;letter-spacing:-1px;margin:0 0 12px}.login-card p{font-size:12px;color:var(--muted);line-height:1.8}.login-card label{display:block;font-size:11px;font-weight:600;margin-top:20px}.login-card input{display:block;width:100%;padding:13px;margin-top:8px;border:1px solid #e3d5dd;border-radius:5px;background:white;font:14px inherit;color:var(--ink)}.login-card button{width:100%;border:0;border-radius:5px;background:#a85573;color:white;padding:14px;margin-top:24px;font:600 12px 'DM Sans',sans-serif;cursor:pointer}.login-card button:disabled{opacity:.6;cursor:wait}.login-card a:focus-visible,.login-card button:focus-visible,.login-card input:focus-visible{outline:3px solid #caa0b4;outline-offset:3px}.login-card .back{display:block;text-align:center;margin-top:24px;color:var(--pink);font-size:11px}#access-status{min-height:24px;margin-bottom:0}</style><link rel="icon" type="image/png" href="assets/limagecils-pro.png?v=20261115-4"><link rel="apple-touch-icon" href="assets/limagecils-pro.png?v=20261115-4"><meta name="apple-mobile-web-app-title" content="LIMAGECILS PRO"><link rel="manifest" href="manifest.webmanifest?v=20261115-4"></head><body><section class="login-card"><div class="brand"><img class="brand-image brand-image-login" src="assets/limagecils-pro.png?v=20261115-4" alt="LIMAGECILS PRO" width="1254" height="1254"></div><h1>Bienvenue.</h1><p>Valide ton e-mail et ton mot de passe à chaque ouverture, même sur un appareil déjà utilisé.</p><form id="access-form"><label for="access-email">E-mail<input id="access-email" type="email" autocomplete="username" required></label><label for="access-password">Mot de passe<input id="access-password" type="password" autocomplete="current-password" required></label><label for="access-api-key">Clé API Anthropic / Claude<input id="access-api-key" type="password" autocomplete="off" placeholder="sk-ant-…"></label><p>Cette clé est nécessaire pour les actions IA : import du planning et analyse de documents. Les autres outils restent accessibles sans clé.</p><button id="access-submit" type="submit" disabled>Me connecter</button><p id="access-status" role="status" aria-live="polite">Vérification de ta connexion…</p></form><a class="back" href="https://emmacaulinech-lab.github.io/emma/" target="_top">← Revenir à EMMA OS</a></section><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script><script src="formations-config.js?v=20261115-3"></script><script src="access-auth.js?v=20261115-5"></script></body></html>
